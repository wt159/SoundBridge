name: sb-flake-probe

# ============================================================
# 取证专用探针（issue #141）——不是门禁，不是产品构建
#
# 第二轮结论（2026-11-12，run 43187863287）：
#   1. ASan 全量 ctest 走进死胡同：15/15 全红，但一条 ASan 报告都没有。
#      红的是 test_player_integration.cpp 的时序断言（:1090 / :1693 / :1701
#      的 playing / resumed / states.front()），即插桩把时间窗拖坏，
#      原本要靠「采样撞短窗口」的断言必然失败。ASan 报告为零 →
#      目标崩溃在 15 轮里没有复现，且这条路会引入假红噪声。
#   2. 不插桩的 A/B（12 轮 × 2）里，B 侧（P1 之后）复现了目标崩溃
#      2/12，崩溃点 :726 与 :561，与 CI 上 4 次历史事件同形态。
#      但 A 侧（P1 之前）12 轮里 4 次红全是 sdk_unit_tests，
#      即已修的 #140（守卫 2s = mock server recv 超时），
#      说明该 A/B 被 #140 污染，两侧差异不能直接归因 P1。
#
# 本轮做法：放弃插桩，改用 gdb 在崩溃现场抓栈。
#   - 非插桩 Debug 构建，时序断言的机器码与 CI 一致；
#   - `handle SIGSEGV stop print nopass` 抢在 doctest 自带的信号处理器之前
#     停住，因此能拿到真实崩溃栈，而不是只看到 "test case CRASHED"；
#   - 4 个并发 worker 制造 CPU 争用（崩溃需要 -j4 并发才现）。
#
# 红线：只由 push 到 probe/** 触发，不挂 master / pull_request；
#       不改任何 sdk_* 目标、TIMEOUT、套件分组、既有判据；
#       失败不当门禁，只作取证数据。取证完成整条分支删除。
# ============================================================

on:
  push:
    branches:
      - 'probe/**'
  workflow_dispatch:

jobs:
  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      # P1 之后的 master tip
      REF: 51d4ac51cbc036d6c14e372da378e9174c3dd028
      WORKERS: 4
      ITERS: 25
      SUITES: 'MusicPlayer Interactive Paths,PublicPlayer Interactive Paths'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 20

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libpulse-dev qtbase5-dev gdb

      - name: Build 3rdparty deps
        run: |
          cmake -S sdk/3rdparty -B sdk/3rdparty/build \
            -Wno-unused-cli \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/cmake/toolchain/toolchain.linux_x86_64_gcc.cmake \
            -G "Unix Makefiles" \
            -DBUILD_OPTION_BOOST=ON \
            -DBUILD_OPTION_FFMPEG=ON \
            -DBUILD_OPTION_FLAC=ON \
            -DBUILD_OPTION_OGG=ON \
            -DBUILD_OPTION_VORBIS=ON \
            -DBUILD_OPTION_SDL2=ON \
            -DBUILD_OPTION_ZLIB=ON
          cmake --build sdk/3rdparty/build
          cmake --install sdk/3rdparty/build

      - name: Checkout target ref and build (no sanitizer)
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          git checkout -q "$REF"
          git log --oneline -1
          cmake -S . -B build-dbg \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/cmake/toolchain/toolchain.linux_x86_64_gcc.cmake \
            -G "Unix Makefiles"
          cmake --build build-dbg --target UnitTests -j4

      - name: Loop interaction suite under gdb
        run: |
          set -o pipefail
          : > stack-rounds.log
          export LD_LIBRARY_PATH="${{ github.workspace }}/sdk/3rdparty/dist/linux_x86_64_gcc_debug/lib"
          BIN="${{ github.workspace }}/build-dbg/sdk/test/UnitTests"
          WORKDIR="${{ github.workspace }}/sdk/test"

          worker() {
            w="$1"
            for i in $(seq 1 "$ITERS"); do
              out="gdb-w${w}-${i}.log"
              ( cd "$WORKDIR" && gdb -batch -nx -q \
                  -ex "set pagination off" \
                  -ex "set confirm off" \
                  -ex "handle SIGSEGV stop print nopass" \
                  -ex "handle SIGABRT stop print nopass" \
                  -ex run \
                  -ex "echo \n===== BACKTRACE =====\n" \
                  -ex "thread apply all bt" \
                  -ex "echo \n===== THREADS =====\n" \
                  -ex "info threads" \
                  --args "$BIN" "-ts=$SUITES" ) > "$out" 2>&1
              if grep -q "Program received signal SIGSEGV" "$out"; then
                echo "worker=$w iter=$i CRASH" >> crash-hits.log
                cp "$out" "crash-w${w}-${i}.log"
                return 0
              fi
              echo "worker=$w iter=$i clean" >> stack-rounds.log
              rm -f "$out"
            done
            return 0
          }

          : > crash-hits.log
          for w in $(seq 1 "$WORKERS"); do
            worker "$w" &
          done
          wait

          echo "=== runs: $(wc -l < stack-rounds.log) clean, $(wc -l < crash-hits.log) crash ===" | tee -a stack-rounds.log
          cat crash-hits.log || true

      - name: Upload gdb evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gdb-evidence
          path: |
            stack-rounds.log
            crash-hits.log
            crash-*.log

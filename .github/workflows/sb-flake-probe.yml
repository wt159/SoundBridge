name: sb-flake-probe

# ============================================================
# 取证专用探针（issue #141）——不是门禁，不是产品构建
#
# 已排除的路线（2026-11-12）：
#   43187863287  ASan 全量 ctest 15/15 全红但零 ASan 报告 → 插桩拖坏时序断言，信噪比为负
#   43192332706  非插桩 + gdb 单独跑交互套件，4 并发 × 25 轮 = 100 次，0 崩溃
#                → 需要整轮 ctest -j4（14 进程）的负载才现
#   43194544953  整轮 -j4 + core dump，第 4 轮命中 core，栈已拿到：
#                WorkQueue::threadLoopFunc (sdk/cosmos/WorkQueue.hpp:168)
#                → m_taskQueue.pop() 在销毁一个控制块已被释放的 shared_ptr
#                  （_M_release 的 this=0x55，use count 为负的垃圾值）
#                → 崩溃在控制队列的「取不可用任务」分支，与网络源 / P1 取消通道无关
#
# 本轮（2026-11-12 #142 修复验证）：REF 指向 impl/workqueue-fix 的修复提交
#       bc0fb24f4（WorkQueue 结构性修复），16 轮整轮 -j4，预期零 core、
#       零 SIGSEGV——修复前同配方在第 2 / 4 轮即落 core。
#
# 上一轮：同样落 core，但把 gdb 检查做细——从 core 里直接读 WorkQueue 的
#       m_running / m_taskMap.size() / m_taskQueue 实际元素数，
#       验证「用 m_taskMap.size() 当 m_taskQueue 非空判据」这条不变量是否已经破了
#       （破了的话 top()/pop() 就是在空队列上操作，正是观察到的垃圾指针）。
#
# 红线：只由 push 到 probe/** 触发，不挂 master / pull_request；
#       不改任何 sdk_* 目标、TIMEOUT、套件分组、既有判据；
#       失败不当门禁，只作取证数据。取证完成整条分支删除。
# ============================================================

on:
  push:
    branches:
      - 'probe/**'
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      REF: bc0fb24f47b35fd9f613e4957cf9b662e046aacf
      ROUNDS: 16
      COREDIR: /tmp/sbcore
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 20

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libpulse-dev qtbase5-dev gdb

      - name: Build 3rdparty deps
        run: |
          cmake -S sdk/3rdparty -B sdk/3rdparty/build \
            -Wno-unused-cli \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/cmake/toolchain/toolchain.linux_x86_64_gcc.cmake \
            -G "Unix Makefiles" \
            -DBUILD_OPTION_BOOST=ON \
            -DBUILD_OPTION_FFMPEG=ON \
            -DBUILD_OPTION_FLAC=ON \
            -DBUILD_OPTION_OGG=ON \
            -DBUILD_OPTION_VORBIS=ON \
            -DBUILD_OPTION_SDL2=ON \
            -DBUILD_OPTION_ZLIB=ON
          cmake --build sdk/3rdparty/build
          cmake --install sdk/3rdparty/build

      - name: Checkout target ref and build (no sanitizer)
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          git fetch --depth 5 origin impl/workqueue-fix
          git checkout -q "$REF"
          git log --oneline -1
          cmake -S . -B build-dbg \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/cmake/toolchain/toolchain.linux_x86_64_gcc.cmake \
            -G "Unix Makefiles"
          cmake --build build-dbg --target UnitTests TestSdkSuite -j4

      - name: Enable core dumps
        run: |
          sudo mkdir -p "$COREDIR"
          sudo chmod 777 "$COREDIR"
          sudo sysctl -w kernel.core_pattern="$COREDIR/core.%e.%p.%t" || \
            sudo sh -c "echo '$COREDIR/core.%e.%p.%t' > /proc/sys/kernel/core_pattern"
          cat /proc/sys/kernel/core_pattern
          ulimit -c unlimited
          ulimit -c

      - name: Loop full ctest -j4 until a core appears
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          set -o pipefail
          ulimit -c unlimited
          : > core-rounds.log
          for i in $(seq 1 "$ROUNDS"); do
            echo "===== ROUND $i =====" | tee -a core-rounds.log
            if ctest --test-dir build-dbg -R sdk_ -j4 --output-on-failure > "core-run-$i.log" 2>&1; then
              echo "round=$i GREEN" | tee -a core-rounds.log
            else
              echo "round=$i RED" | tee -a core-rounds.log
              grep -E "The following tests FAILED" -A3 "core-run-$i.log" | tee -a core-rounds.log
              grep -E "CRASHED: SIGSEGV|Segmentation fault" "core-run-$i.log" | tee -a core-rounds.log || true
            fi
            rm -rf sdk/test/log/* 2>/dev/null || true
            if ls "$COREDIR"/core.* >/dev/null 2>&1; then
              echo "CORE FOUND after round=$i" | tee -a core-rounds.log
              break
            fi
          done
          ls -la "$COREDIR" | tee -a core-rounds.log || true

      - name: Inspect WorkQueue state from core
        run: |
          shopt -s nullglob
          : > inspect.txt
          for c in "$COREDIR"/core.*; do
            case "$c" in
              *UnitTests*) ;;
              *) continue ;;
            esac
            {
              echo "########## $c ##########"
              gdb -batch -nx -q \
                -ex "set pagination off" \
                -ex "set print frame-arguments none" \
                -ex "echo \n===== CRASH FRAME =====\n" \
                -ex "bt 20" \
                -ex "echo \n===== WORKQUEUE STATE =====\n" \
                -ex "thread 1" \
                -ex "frame 8" \
                -ex "info args" \
                -ex "print this->m_running" \
                -ex "print this->m_taskMap.size()" \
                -ex "print this->m_taskQueue.c.size()" \
                -ex "print this->m_taskQueue.c.capacity()" \
                -ex "echo \n===== ALL THREADS (short) =====\n" \
                -ex "thread apply all bt 6" \
                "${{ github.workspace }}/build-dbg/sdk/test/UnitTests" "$c"
            } 2>&1 | tee -a inspect.txt
          done
          grep -q "WORKQUEUE STATE" inspect.txt || echo "NO CORE PRODUCED" | tee -a inspect.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-evidence
          path: |
            core-rounds.log
            core-run-*.log
            inspect.txt

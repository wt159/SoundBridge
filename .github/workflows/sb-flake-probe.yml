name: sb-flake-probe

# ============================================================
# 取证专用探针（issue #141）——不是门禁，不是产品构建
#
# 已排除的两条路（2026-11-12）：
#   轮二 43187863287：ASan 全量 ctest 15/15 全红但零 ASan 报告，
#     红的是 test_player_integration.cpp 的时序断言（:1090 / :1693 / :1701），
#     插桩把「采样撞短窗口」的判定拖坏 → 信噪比为负。
#   轮三 43192332706：非插桩 Debug + gdb batch（handle SIGSEGV stop print
#     nopass 抢在 doctest 信号处理器之前停住），单独跑
#     `UnitTests -ts="MusicPlayer Interactive Paths,PublicPlayer Interactive Paths"`
#     4 并发 worker × 25 轮 = 100 次，**0 崩溃**。
#     → 该崩溃不是交互套件内部的竞态，需要整个 `ctest -R sdk_ -j4`
#       （14 个进程并发）的负载/内存压力才现。
#
# 本轮做法：整轮 `ctest -R sdk_ -j4` 照常跑（不插桩、不套 gdb，时序判定
# 与 CI 完全一致），靠 core dump 事后取栈。doctest 的信号处理器会重新抛
# 默认动作（CI 日志里 ctest 打印 "Segmentation fault" 即证据），因此能落 core。
#
# 红线：只由 push 到 probe/** 触发，不挂 master / pull_request；
#       不改任何 sdk_* 目标、TIMEOUT、套件分组、既有判据；
#       失败不当门禁，只作取证数据。取证完成整条分支删除。
# ============================================================

on:
  push:
    branches:
      - 'probe/**'
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      # P1 之后的 master tip
      REF: 51d4ac51cbc036d6c14e372da378e9174c3dd028
      ROUNDS: 20
      COREDIR: /tmp/sbcore
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 20

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libpulse-dev qtbase5-dev gdb

      - name: Build 3rdparty deps
        run: |
          cmake -S sdk/3rdparty -B sdk/3rdparty/build \
            -Wno-unused-cli \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/cmake/toolchain/toolchain.linux_x86_64_gcc.cmake \
            -G "Unix Makefiles" \
            -DBUILD_OPTION_BOOST=ON \
            -DBUILD_OPTION_FFMPEG=ON \
            -DBUILD_OPTION_FLAC=ON \
            -DBUILD_OPTION_OGG=ON \
            -DBUILD_OPTION_VORBIS=ON \
            -DBUILD_OPTION_SDL2=ON \
            -DBUILD_OPTION_ZLIB=ON
          cmake --build sdk/3rdparty/build
          cmake --install sdk/3rdparty/build

      - name: Checkout target ref and build (no sanitizer)
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          git checkout -q "$REF"
          git log --oneline -1
          cmake -S . -B build-dbg \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/cmake/toolchain/toolchain.linux_x86_64_gcc.cmake \
            -G "Unix Makefiles"
          cmake --build build-dbg --target UnitTests TestSdkSuite -j4

      - name: Enable core dumps
        run: |
          set -x
          sudo mkdir -p "$COREDIR"
          sudo chmod 777 "$COREDIR"
          echo "before: $(cat /proc/sys/kernel/core_pattern)"
          sudo sysctl -w kernel.core_pattern="$COREDIR/core.%e.%p.%t" || \
            sudo sh -c "echo '$COREDIR/core.%e.%p.%t' > /proc/sys/kernel/core_pattern"
          cat /proc/sys/kernel/core_pattern
          ulimit -c unlimited
          ulimit -c

      - name: Loop full ctest -j4 until a core appears
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          set -o pipefail
          ulimit -c unlimited
          : > core-rounds.log
          for i in $(seq 1 "$ROUNDS"); do
            echo "===== ROUND $i =====" | tee -a core-rounds.log
            if ctest --test-dir build-dbg -R sdk_ -j4 --output-on-failure > "core-run-$i.log" 2>&1; then
              echo "round=$i GREEN" | tee -a core-rounds.log
            else
              echo "round=$i RED" | tee -a core-rounds.log
              grep -E "The following tests FAILED" -A3 "core-run-$i.log" | tee -a core-rounds.log
              grep -E "CRASHED: SIGSEGV|Segmentation fault" "core-run-$i.log" | tee -a core-rounds.log || true
            fi
            rm -rf sdk/test/log/* 2>/dev/null || true
            if ls "$COREDIR"/core.* >/dev/null 2>&1; then
              echo "CORE FOUND after round=$i" | tee -a core-rounds.log
              break
            fi
          done
          echo "=== cores: ===" | tee -a core-rounds.log
          ls -la "$COREDIR" | tee -a core-rounds.log || true

      - name: Backtrace from cores
        run: |
          shopt -s nullglob
          : > backtrace.txt
          found=0
          for c in "$COREDIR"/core.*; do
            found=1
            {
              echo "########## $c ##########"
              # 只处理 UnitTests 的 core（目标是 sdk_interaction_tests）
              case "$c" in
                *UnitTests*) gdb -batch -nx -q \
                    -ex "set pagination off" \
                    -ex "echo \n===== BACKTRACE (all threads) =====\n" \
                    -ex "info threads" \
                    -ex "thread apply all bt full" \
                    "${{ github.workspace }}/build-dbg/sdk/test/UnitTests" "$c" ;;
                *) echo "skip $c" ;;
              esac
            } 2>&1 | tee -a backtrace.txt
          done
          if [ "$found" = "0" ]; then echo "NO CORE PRODUCED" | tee -a backtrace.txt; fi

      - name: Upload core evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-evidence
          path: |
            core-rounds.log
            core-run-*.log
            backtrace.txt

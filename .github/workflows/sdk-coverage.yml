name: sdk-coverage

on:
  push:
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'app/**'
      - 'scripts/**'
      - 'sdk/**'
      - '.github/workflows/sdk-coverage.yml'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'app/**'
      - 'scripts/**'
      - 'sdk/**'
      - '.github/workflows/sdk-coverage.yml'

jobs:
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install coverage tools
        run: sudo apt-get update && sudo apt-get install -y lcov libpulse-dev qtbase5-dev

      - name: Build 3rdparty deps
        run: |
          # zlib/ogg/vorbis/SDL/g3log 等供应商源码仍声明 cmake_minimum_required < 3.5，
          # 而 runner 上的 CMake 4 已移除对 < 3.5 的兼容。这里用 policy 变量兜底，
          # 避免修改 sdk/3rdparty 下的第三方代码。
          cmake -S sdk/3rdparty -B sdk/3rdparty/build \
            -Wno-unused-cli \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/cmake/toolchain/toolchain.linux_x86_64_gcc.cmake \
            -G "Unix Makefiles" \
            -DBUILD_OPTION_BOOST=ON \
            -DBUILD_OPTION_FFMPEG=ON \
            -DBUILD_OPTION_FLAC=ON \
            -DBUILD_OPTION_OGG=ON \
            -DBUILD_OPTION_VORBIS=ON \
            -DBUILD_OPTION_SDL2=ON \
            -DBUILD_OPTION_ZLIB=ON
          cmake --build sdk/3rdparty/build
          cmake --install sdk/3rdparty/build

      - name: Configure coverage build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/cmake/toolchain/toolchain.linux_x86_64_gcc.cmake -DENABLE_COVERAGE=ON -G "Unix Makefiles"

      - name: Build coverage target
        run: cmake --build build --target coverage
        env:
          SDL_AUDIODRIVER: dummy

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v7
        with:
          name: sdk-coverage-html
          path: build/coverage/html

      # 覆盖度矩阵的 14 行「declared / measured」只在断言失败时才由 doctest 打印，
      # 通过时数值不可见。这里用 -s 打开成功断言输出，把 Linux 侧的实测毫秒数留在日志里，
      # 供与 Windows 侧核对（两侧必须落在同一容差内，见 doc/format-support.md）。
      - name: Report coverage matrix numbers
        run: |
          set -o pipefail
          LD_LIBRARY_PATH="${{ github.workspace }}/sdk/3rdparty/dist/linux_x86_64_gcc_debug/lib" \
            ./build/sdk/test/UnitTests -ts=MediaCoverage -s \
            | grep -E "declared |coverage matrix covered"
